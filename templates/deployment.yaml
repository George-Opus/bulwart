{{- if and (eq .Values.configMode "env") (not .Values.config.jmapServerUrl) }}
{{- fail "configMode=env requires config.jmapServerUrl to be set (this is what disables the setup wizard)" }}
{{- end }}
{{- if and (eq .Values.configMode "wizard") (not .Values.persistence.config.enabled) }}
{{- fail "configMode=wizard requires persistence.config.enabled=true, otherwise the wizard-written config is lost on restart" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bulwark.fullname" . }}
  labels:
    {{- include "bulwark.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if or .Values.persistence.config.enabled .Values.persistence.adminState.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "bulwark.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "bulwark.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bulwark.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bulwark
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            {{- if eq .Values.configMode "env" }}
            - name: JMAP_SERVER_URL
              value: {{ .Values.config.jmapServerUrl | quote }}
            {{- end }}
            {{- with .Values.config.appName }}
            - name: APP_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logFormat }}
            - name: LOG_FORMAT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.logLevel }}
            - name: LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.sessionSecret.existingSecret .Values.sessionSecret.value }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "bulwark.sessionSecretName" . }}
                  key: {{ .Values.sessionSecret.existingSecretKey }}
            {{- end }}
            {{- if .Values.oauth.enabled }}
            - name: OAUTH_ENABLED
              value: "true"
            {{- with .Values.oauth.issuerUrl }}
            - name: OAUTH_ISSUER_URL
              value: {{ . | quote }}
            {{- end }}
            - name: OAUTH_CLIENT_ID
              value: {{ .Values.oauth.clientId | quote }}
            {{- if .Values.oauth.existingSecret }}
            - name: OAUTH_CLIENT_SECRET_FILE
              value: /run/secrets/oauth/{{ .Values.oauth.existingSecretKey }}
            {{- end }}
            {{- if .Values.oauth.only }}
            - name: OAUTH_ONLY
              value: "true"
            {{- end }}
            {{- with .Values.oauth.scopes }}
            - name: OAUTH_SCOPES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oauth.extraScopes }}
            - name: OAUTH_EXTRA_SCOPES
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.config.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            {{- if eq .Values.probes.liveness.type "http" }}
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            {{- if eq .Values.probes.readiness.type "http" }}
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if and .Values.oauth.enabled .Values.oauth.existingSecret }}
            - name: oauth-secret
              mountPath: /run/secrets/oauth
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.config.enabled }}
            - name: config
              mountPath: /app/data/admin
            {{- end }}
            {{- if .Values.persistence.adminState.enabled }}
            - name: admin-state
              mountPath: /app/data/admin-state
            {{- end }}
      volumes:
        {{- if and .Values.oauth.enabled .Values.oauth.existingSecret }}
        - name: oauth-secret
          secret:
            secretName: {{ .Values.oauth.existingSecret }}
        {{- end }}
        {{- if .Values.persistence.config.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.config.existingClaim | default (printf "%s-config" (include "bulwark.fullname" .)) }}
        {{- end }}
        {{- if .Values.persistence.adminState.enabled }}
        - name: admin-state
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.adminState.existingClaim | default (printf "%s-admin-state" (include "bulwark.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
